name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/statzavod-app:${{ github.sha }}
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/statzavod-web:${{ github.sha }}

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go
        run: go test ./...

      - name: Vet Go
        run: go vet ./...

      - name: Build Go binaries
        run: go build ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

  images:
    name: Build and publish images
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/statzavod-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/statzavod-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path without spaces." >&2
            exit 1
          fi
          if [ -z "$HEALTHCHECK_URL" ]; then
            HEALTHCHECK_URL="https://statzavod.ru/readyz"
            echo "HEALTHCHECK_URL=$HEALTHCHECK_URL" >> "$GITHUB_ENV"
          fi
          if [[ ! "$HEALTHCHECK_URL" =~ ^https://[A-Za-z0-9._:/-]+$ ]]; then
            echo "HEALTHCHECK_URL must be a simple HTTPS URL." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing required production secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Login server to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Upload release configuration
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/${GITHUB_SHA}"

          printf 'APP_IMAGE=%s\nWEB_IMAGE=%s\n' "$APP_IMAGE" "$WEB_IMAGE" > images.env
          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" \
            "mkdir -p $release_dir $DEPLOY_PATH/shared"
          scp -i ~/.ssh/deploy_key -P "$port" \
            deploy/compose.production.yml deploy/deploy.sh images.env \
            "$remote:$release_dir/"

      - name: Activate release
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$remote" \
            "chmod 700 $release_dir/deploy.sh && $release_dir/deploy.sh $DEPLOY_PATH ${GITHUB_SHA} $HEALTHCHECK_URL"
