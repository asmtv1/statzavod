name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/statzavod-app:${{ github.sha }}
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/statzavod-web:${{ github.sha }}

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go
        run: go test -mod=readonly ./...

      - name: Vet Go
        run: go vet -mod=readonly ./...

      - name: Build Go binaries
        run: go build -mod=readonly ./...

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

  images:
    name: Build and publish images
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/statzavod-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/statzavod-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path without spaces." >&2
            exit 1
          fi
          if [ -z "$HEALTHCHECK_URL" ]; then
            HEALTHCHECK_URL="https://statzavod.ru/readyz"
            echo "HEALTHCHECK_URL=$HEALTHCHECK_URL" >> "$GITHUB_ENV"
          fi
          if [[ ! "$HEALTHCHECK_URL" =~ ^https://[A-Za-z0-9._:/-]+$ ]]; then
            echo "HEALTHCHECK_URL must be a simple HTTPS URL." >&2
            exit 1
          fi

      - name: Build production environment
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          BOOTSTRAP_EMAIL: ${{ vars.BOOTSTRAP_EMAIL }}
          BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ vars.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REDIRECT_URL: ${{ vars.YOUTUBE_OAUTH_REDIRECT_URL }}
          INSTAGRAM_OAUTH_CLIENT_ID: ${{ vars.INSTAGRAM_OAUTH_CLIENT_ID }}
          INSTAGRAM_OAUTH_CLIENT_SECRET: ${{ secrets.INSTAGRAM_OAUTH_CLIENT_SECRET }}
          INSTAGRAM_OAUTH_REDIRECT_URL: ${{ vars.INSTAGRAM_OAUTH_REDIRECT_URL }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URL: ${{ vars.TIKTOK_REDIRECT_URL }}
          VK_OAUTH_CLIENT_ID: ${{ vars.VK_OAUTH_CLIENT_ID }}
          VK_OAUTH_CLIENT_SECRET: ${{ secrets.VK_OAUTH_CLIENT_SECRET }}
          VK_OAUTH_REDIRECT_URL: ${{ vars.VK_OAUTH_REDIRECT_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const env = process.env;
          const required = [
            "POSTGRES_PASSWORD",
            "BOOTSTRAP_PASSWORD",
            "TOKEN_ENCRYPTION_KEY"
          ];
          const missing = required.filter((name) => !env[name]);
          if (missing.length > 0) {
            console.error(`Missing required production secrets: ${missing.join(", ")}`);
            process.exit(1);
          }

          const normalizedKey = env.TOKEN_ENCRYPTION_KEY
            .replace(/-/g, "+")
            .replace(/_/g, "/");
          if (Buffer.from(normalizedKey, "base64").length !== 32) {
            console.error("TOKEN_ENCRYPTION_KEY must decode to exactly 32 bytes.");
            process.exit(1);
          }

          const values = {
            POSTGRES_DB: env.POSTGRES_DB || "statzavod",
            POSTGRES_USER: env.POSTGRES_USER || "statzavod",
            POSTGRES_PASSWORD: env.POSTGRES_PASSWORD,
            POSTGRES_DB_URLENCODED: encodeURIComponent(env.POSTGRES_DB || "statzavod"),
            POSTGRES_USER_URLENCODED: encodeURIComponent(env.POSTGRES_USER || "statzavod"),
            POSTGRES_PASSWORD_URLENCODED: encodeURIComponent(env.POSTGRES_PASSWORD),
            PUBLIC_BASE_URL: env.PUBLIC_BASE_URL || "https://statzavod.ru",
            CORS_ORIGIN: env.CORS_ORIGIN || "https://statzavod.ru",
            SITE_ADDRESS: env.SITE_ADDRESS || "statzavod.ru, www.statzavod.ru",
            BOOTSTRAP_EMAIL: env.BOOTSTRAP_EMAIL || "admin@example.com",
            BOOTSTRAP_PASSWORD: env.BOOTSTRAP_PASSWORD,
            TOKEN_ENCRYPTION_KEY: env.TOKEN_ENCRYPTION_KEY,
            SMTP_URL: env.SMTP_URL || "",
            YOUTUBE_OAUTH_CLIENT_ID: env.YOUTUBE_OAUTH_CLIENT_ID || "",
            YOUTUBE_OAUTH_CLIENT_SECRET: env.YOUTUBE_OAUTH_CLIENT_SECRET || "",
            YOUTUBE_OAUTH_REDIRECT_URL:
              env.YOUTUBE_OAUTH_REDIRECT_URL ||
              "https://statzavod.ru/api/v1/oauth/youtube/callback",
            INSTAGRAM_OAUTH_CLIENT_ID: env.INSTAGRAM_OAUTH_CLIENT_ID || "",
            INSTAGRAM_OAUTH_CLIENT_SECRET: env.INSTAGRAM_OAUTH_CLIENT_SECRET || "",
            INSTAGRAM_OAUTH_REDIRECT_URL:
              env.INSTAGRAM_OAUTH_REDIRECT_URL ||
              "https://statzavod.ru/api/v1/oauth/instagram/callback",
            TIKTOK_CLIENT_KEY: env.TIKTOK_CLIENT_KEY || "",
            TIKTOK_CLIENT_SECRET: env.TIKTOK_CLIENT_SECRET || "",
            TIKTOK_REDIRECT_URL:
              env.TIKTOK_REDIRECT_URL ||
              "https://statzavod.ru/api/v1/oauth/tiktok/callback",
            VK_OAUTH_CLIENT_ID: env.VK_OAUTH_CLIENT_ID || "",
            VK_OAUTH_CLIENT_SECRET: env.VK_OAUTH_CLIENT_SECRET || "",
            VK_OAUTH_REDIRECT_URL:
              env.VK_OAUTH_REDIRECT_URL ||
              "https://statzavod.ru/api/v1/oauth/vk/callback"
          };

          const quote = (value) => `'${String(value).replace(/'/g, "\\'")}'`;
          const body = Object.entries(values)
            .map(([name, value]) => `${name}=${quote(value)}`)
            .join("\n");
          fs.writeFileSync("app.env", `${body}\n`, { mode: 0o600 });
          NODE

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing required production secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Login server to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Upload release configuration
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/${GITHUB_SHA}"

          printf 'APP_IMAGE=%s\nWEB_IMAGE=%s\n' "$APP_IMAGE" "$WEB_IMAGE" > images.env
          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" \
            "install -d -m 700 $release_dir"
          scp -i ~/.ssh/deploy_key -P "$port" \
            deploy/compose.production.yml deploy/deploy.sh app.env images.env \
            "$remote:$release_dir/"

      - name: Activate release
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$remote" \
            "chmod 600 $release_dir/app.env $release_dir/images.env && chmod 700 $release_dir/deploy.sh && $release_dir/deploy.sh $DEPLOY_PATH ${GITHUB_SHA} $HEALTHCHECK_URL"
