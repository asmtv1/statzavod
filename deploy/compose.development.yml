services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: statzavod
      POSTGRES_USER: statzavod
      POSTGRES_PASSWORD: statzavod
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statzavod -d statzavod"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: ["migrate"]
    environment: &env
      DATABASE_URL: postgres://statzavod:statzavod@postgres:5432/statzavod?sslmode=disable
      APP_ENV: development
      BOOTSTRAP_EMAIL: admin@example.com
      BOOTSTRAP_PASSWORD: change-me-before-production
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment: *env
    env_file: [../.env]
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: ["worker"]
    environment: *env
    env_file: [../.env]
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    ports: ["5173:80"]
    depends_on: [api]
