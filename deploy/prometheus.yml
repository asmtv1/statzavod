global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/content-publishing-alerts.yml

scrape_configs:
  - job_name: statzavod-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8080
        labels:
          service: statzavod-api

